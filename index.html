<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虛寶金庫 - 珍藏大師管理平台</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* 隱藏捲軸但保留滾動功能 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* 淡入動畫 */
    .fade-in { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

  <!-- 載入中畫面 -->
  <div id="loading-screen" class="fixed inset-0 bg-slate-50 flex items-center justify-center z-50">
    <div class="animate-pulse flex flex-col items-center">
      <i data-lucide="gamepad-2" class="w-12 h-12 text-blue-600 mb-4"></i>
      <p class="text-slate-500 font-medium">連線至虛寶金庫中...</p>
    </div>
  </div>

  <!-- 登入畫面 -->
  <div id="login-screen" class="hidden fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-40">
    <div class="bg-white max-w-md w-full rounded-3xl p-8 shadow-2xl text-center">
      <div class="w-20 h-20 bg-blue-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-lg shadow-blue-500/30">
        <i data-lucide="gamepad-2" class="w-10 h-10"></i>
      </div>
      <h1 class="text-3xl font-bold text-slate-900 mb-2">虛寶金庫</h1>
      <p class="text-slate-500 mb-8">專為頂級玩家打造的數位資產展間</p>
      
      <button onclick="window.app.handleLogin()" class="w-full bg-white border-2 border-slate-200 hover:bg-slate-50 text-slate-700 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition-colors">
        <svg class="w-6 h-6" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        使用 Google 帳號登入
      </button>
    </div>
  </div>

  <!-- 主應用程式介面 -->
  <div id="main-app" class="hidden flex min-h-screen">
    <!-- 側邊導航欄 -->
    <aside class="w-20 lg:w-64 border-r border-slate-200 bg-white flex flex-col p-4 sticky top-0 h-screen">
      <div class="flex items-center gap-3 px-2 mb-10">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-inner">
          <i data-lucide="gamepad-2" class="w-6 h-6"></i>
        </div>
        <span class="font-bold text-xl tracking-tight lg:block hidden">虛寶金庫</span>
      </div>

      <nav class="flex-1 space-y-2" id="sidebar-nav">
        <!-- 動態產生 -->
      </nav>

      <div class="mt-auto space-y-2 border-t pt-4">
        <button onclick="window.app.handleLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-500 hover:bg-slate-100 hover:text-rose-600">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          <span class="font-medium text-sm lg:block hidden">登出帳號</span>
        </button>
      </div>
    </aside>

    <!-- 主要內容區 -->
    <main class="flex-1 flex flex-col min-w-0">
      <!-- 頂部搜索與個人資料 -->
      <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10">
        <div class="relative w-full max-w-md">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
          <input 
            type="text" 
            id="search-input"
            placeholder="搜尋虛寶、標籤或分類..."
            class="w-full bg-slate-100 border-none rounded-2xl py-2.5 pl-10 pr-4 text-sm focus:ring-2 focus:ring-blue-500/20 transition-all outline-none"
            oninput="window.app.handleSearch(this.value)"
          />
        </div>

        <div class="flex items-center gap-4">
          <div class="flex flex-col items-end mr-2 hidden sm:flex" id="user-info">
            <!-- 動態填入 -->
          </div>
          <div class="h-10 w-10 rounded-full bg-slate-200 border-2 border-white shadow-sm overflow-hidden" id="user-avatar-container">
            <!-- 動態填入 -->
          </div>
        </div>
      </header>

      <!-- 內容展示區 -->
      <div class="p-8 max-w-7xl mx-auto w-full" id="content-area">
        <!-- 動態渲染控制面板或列表 -->
      </div>
    </main>
  </div>

  <!-- 新增/上傳 Modal -->
  <div id="add-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="window.app.closeModal()"></div>
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl relative overflow-hidden fade-in">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="text-xl font-bold flex items-center gap-2">
          <i data-lucide="gamepad-2" class="w-6 h-6 text-blue-600"></i> 登錄新虛寶
        </h2>
        <button onclick="window.app.closeModal()" class="text-slate-400 hover:text-slate-900 p-1 rounded-lg hover:bg-slate-200 transition-colors">
          <i data-lucide="plus" class="w-6 h-6 rotate-45 transform"></i>
        </button>
      </div>
      
      <div class="p-8 space-y-5 max-h-[80vh] overflow-y-auto no-scrollbar">
        <!-- Base64 圖片上傳區 -->
        <div class="space-y-2">
          <label class="text-sm font-semibold text-slate-700 block">虛寶截圖</label>
          <div class="relative">
            <input 
              type="file" 
              accept="image/*"
              onchange="window.app.handleImageChange(event)"
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" 
            />
            <div id="image-preview-container" class="w-full h-40 border-2 border-dashed border-slate-300 bg-slate-50 hover:border-blue-400 rounded-2xl flex flex-col items-center justify-center overflow-hidden transition-colors">
              <i data-lucide="image-plus" class="w-8 h-8 text-slate-400 mb-2" id="img-placeholder-icon"></i>
              <span class="text-sm font-medium text-slate-500" id="img-placeholder-text">點擊或拖曳上傳截圖</span>
              <span class="text-xs text-slate-400 mt-1" id="img-placeholder-sub">將自動轉換並壓縮為 Base64</span>
              <img id="image-preview" src="" alt="Preview" class="hidden w-full h-full object-contain" />
            </div>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold text-slate-700">虛寶名稱</label>
          <input 
            type="text" 
            id="item-name"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500/50 transition-shadow" 
            placeholder="例如：+15 毀滅之劍" 
          />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="text-sm font-semibold text-slate-700">遊戲/平台分類</label>
            <select id="item-collection" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500/50">
              <option value="1">MMORPG 神兵</option>
              <option value="2">FPS 稀有槍皮</option>
              <option value="3">NFT 加密資產</option>
              <option value="4">電競冠軍造型</option>
            </select>
          </div>
          <div class="space-y-2">
            <label class="text-sm font-semibold text-slate-700">稀有度</label>
            <select id="item-status" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500/50">
              <option>神話</option>
              <option>傳說</option>
              <option>史詩</option>
              <option>精良</option>
            </select>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold text-slate-700">當前市值 (估價)</label>
          <input 
            type="text" 
            id="item-price"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500/50" 
            placeholder="例如：NT$ 35,000 或 1.5 ETH" 
          />
        </div>

        <div class="pt-4 flex gap-3">
          <button onclick="window.app.closeModal()" class="flex-1 px-6 py-3 border-2 border-slate-200 text-slate-600 rounded-2xl font-bold hover:bg-slate-50 transition-colors">
            取消
          </button>
          <button id="save-btn" onclick="window.app.handleAddItem()" class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-2xl font-bold shadow-lg shadow-blue-500/30 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
            確認儲存
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 應用程式邏輯 (Firebase & State) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // === Firebase 初始化 ===
    const firebaseConfig = {
      apiKey: "AIzaSyBiBHaVqe-pvGp_0ReI9FY-A1AMhrWkqNY",
      authDomain: "colletor-c80dc.firebaseapp.com",
      projectId: "colletor-c80dc",
      storageBucket: "colletor-c80dc.firebasestorage.app",
      messagingSenderId: "192990891941",
      appId: "1:192990891941:web:355237ab54607fbc09624c"
    };

    const fbApp = initializeApp(firebaseConfig);
    const auth = getAuth(fbApp);
    const db = getFirestore(fbApp);
    const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'colletor-app';

    // === 狀態管理 ===
    const state = {
      user: null,
      items: [],
      activeTab: 'dashboard',
      selectedCollection: null,
      viewMode: 'grid',
      searchQuery: '',
      newItemImageBase64: '',
      unsubscribeSnapshot: null
    };

    const INITIAL_COLLECTIONS = [
      { id: 1, name: 'MMORPG 神兵', category: '遊戲道具', color: 'bg-red-500', icon: 'swords' },
      { id: 2, name: 'FPS 稀有槍皮', category: '射擊遊戲', color: 'bg-emerald-500', icon: 'gamepad-2' },
      { id: 3, name: 'NFT 加密資產', category: '數位藝術', color: 'bg-purple-500', icon: 'gem' },
      { id: 4, name: '電競冠軍造型', category: 'MOBA', color: 'bg-blue-500', icon: 'trophy' },
    ];

    const NAV_ITEMS = [
      { id: 'dashboard', label: '控制面板', icon: 'layout-grid' },
      { id: 'collections', label: '我的收藏', icon: 'package' },
      { id: 'wishlist', label: '願望清單', icon: 'heart' },
      { id: 'analytics', label: '價值分析', icon: 'trending-up' }
    ];

    // === 核心渲染函式 ===
    function render() {
      // 處理畫面顯示
      document.getElementById('loading-screen').classList.add('hidden');
      if (!state.user) {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('main-app').classList.add('hidden');
        return;
      }
      
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');

      renderSidebar();
      renderHeader();
      renderContent();
      
      // 重新啟動 Lucide Icon 渲染
      lucide.createIcons();
    }

    function renderSidebar() {
      const navContainer = document.getElementById('sidebar-nav');
      navContainer.innerHTML = NAV_ITEMS.map(item => {
        const isActive = state.activeTab === item.id;
        const activeClass = isActive 
          ? 'bg-blue-600 text-white shadow-lg shadow-blue-200' 
          : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900';
        return `
          <button onclick="window.app.setTab('${item.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 ${activeClass}">
            <i data-lucide="${item.icon}" class="w-5 h-5"></i>
            <span class="font-medium text-sm lg:block hidden">${item.label}</span>
          </button>
        `;
      }).join('');
    }

    function renderHeader() {
      document.getElementById('user-info').innerHTML = `
        <span class="text-sm font-bold">${state.user.displayName || '高階玩家'}</span>
        <span class="text-xs text-slate-400">${state.user.email}</span>
      `;
      document.getElementById('user-avatar-container').innerHTML = `
        <img src="${state.user.photoURL || 'https://api.dicebear.com/7.x/avataaars/svg?seed=Felix'}" alt="User" class="w-full h-full object-cover" />
      `;
    }

    function renderContent() {
      const contentArea = document.getElementById('content-area');
      
      let currentItems = state.selectedCollection 
        ? state.items.filter(i => i.collectionId === state.selectedCollection.id)
        : state.items;

      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        currentItems = currentItems.filter(i => 
          i.name.toLowerCase().includes(q) || (i.tags && i.tags.some(tag => tag.toLowerCase().includes(q)))
        );
      }

      if (!state.selectedCollection && state.activeTab === 'dashboard') {
        // --- 儀表板視圖 ---
        const collectionsHtml = INITIAL_COLLECTIONS.map(col => {
          const count = state.items.filter(i => i.collectionId === col.id).length;
          return `
            <div onclick="window.app.selectCollection(${col.id})" class="group bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer">
              <div class="h-24 ${col.color} relative overflow-hidden">
                <div class="absolute top-0 right-0 p-8 opacity-20 transform translate-x-4 -translate-y-4 group-hover:scale-110 transition-transform">
                  <i data-lucide="${col.icon}" class="w-20 h-20"></i>
                </div>
              </div>
              <div class="p-6 relative">
                <div class="absolute -top-10 left-6 w-14 h-14 bg-white rounded-2xl shadow-lg flex items-center justify-center text-slate-700">
                  <i data-lucide="tag" class="w-7 h-7"></i>
                </div>
                <div class="mt-4">
                  <h3 class="font-bold text-lg group-hover:text-blue-600 transition-colors">${col.name}</h3>
                  <p class="text-slate-400 text-sm mb-4">${col.category}</p>
                  <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-600 bg-slate-100 px-3 py-1 rounded-full">${count} 件裝備</span>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        contentArea.innerHTML = `
          <div class="space-y-8 fade-in">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
              <div>
                <h1 class="text-3xl font-bold text-slate-900">歡迎回來，${state.user.displayName || '玩家'}</h1>
                <p class="text-slate-500 mt-1">目前您總共擁有 ${state.items.length} 件珍稀虛寶。</p>
              </div>
              <button onclick="window.app.openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl flex items-center justify-center gap-2 font-semibold shadow-lg shadow-blue-200 transition-all active:scale-95 whitespace-nowrap">
                <i data-lucide="plus" class="w-5 h-5"></i>
                <span class="hidden sm:inline">登錄新虛寶</span>
              </button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mt-8">
              ${collectionsHtml}
            </div>
          </div>
        `;
      } else if (state.selectedCollection || state.activeTab === 'collections') {
        // --- 虛寶列表視圖 ---
        const title = state.selectedCollection ? state.selectedCollection.name : '所有珍稀虛寶';
        
        let itemsHtml = '';
        if (state.viewMode === 'grid') {
          const cardsHtml = currentItems.map(item => {
            let statusColor = 'bg-blue-500/80';
            if(item.status === '傳說') statusColor = 'bg-amber-500/80';
            else if(item.status === '神話') statusColor = 'bg-rose-500/80';
            else if(item.status === '史詩') statusColor = 'bg-purple-500/80';

            return `
              <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden hover:shadow-lg transition-all group relative">
                <div class="relative h-48 overflow-hidden bg-slate-900 flex items-center justify-center">
                  <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500 opacity-90 group-hover:opacity-100" />
                  <div class="absolute top-3 right-3 flex gap-2">
                    <button onclick="window.app.handleDeleteItem('${item.id}')" class="bg-black/50 hover:bg-rose-500 backdrop-blur text-white p-2 rounded-xl shadow-sm transition-colors">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                  </div>
                  <div class="absolute bottom-3 left-3 flex gap-1">
                    <span class="backdrop-blur text-white font-bold text-[10px] px-2 py-1 rounded-lg ${statusColor}">${item.status}</span>
                  </div>
                </div>
                <div class="p-5">
                  <div class="flex justify-between items-start mb-2">
                    <h4 class="font-bold text-slate-900 leading-tight truncate pr-4">${item.name}</h4>
                  </div>
                  <div class="flex justify-between items-center pt-4 border-t border-slate-50 mt-2">
                    <div class="flex items-center gap-2 text-slate-400">
                      <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                      <span class="text-xs">${item.date}</span>
                    </div>
                    <span class="font-bold text-blue-600 truncate max-w-[100px]">${item.price}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('');

          itemsHtml = `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
              ${cardsHtml}
              <button onclick="window.app.openModal()" class="border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center p-8 text-slate-400 hover:border-blue-400 hover:text-blue-400 hover:bg-blue-50 transition-all group min-h-[280px]">
                <div class="w-12 h-12 rounded-full border-2 border-dashed border-slate-300 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                  <i data-lucide="plus" class="w-6 h-6"></i>
                </div>
                <span class="font-semibold">登錄新虛寶</span>
              </button>
            </div>
          `;
        } else {
          // List View
          const rowsHtml = currentItems.length === 0 ? 
            `<tr><td colspan="5" class="text-center py-8 text-slate-400">目前尚無收藏品</td></tr>` : 
            currentItems.map(item => {
              let statusClass = 'bg-blue-100 text-blue-700';
              if(item.status === '傳說') statusClass = 'bg-amber-100 text-amber-700';
              else if(item.status === '神話') statusClass = 'bg-rose-100 text-rose-700';
              else if(item.status === '史詩') statusClass = 'bg-purple-100 text-purple-700';
              
              return `
                <tr class="hover:bg-slate-50 transition-colors">
                  <td class="px-6 py-4">
                    <div class="flex items-center gap-3">
                      <img src="${item.image}" class="w-10 h-10 rounded-lg object-cover bg-slate-200" alt="" />
                      <span class="font-semibold text-sm">${item.name}</span>
                    </div>
                  </td>
                  <td class="px-6 py-4 text-sm text-slate-500">${item.date}</td>
                  <td class="px-6 py-4">
                    <span class="px-2 py-1 rounded-lg text-xs font-bold ${statusClass}">${item.status}</span>
                  </td>
                  <td class="px-6 py-4 font-bold text-sm text-slate-700">${item.price}</td>
                  <td class="px-6 py-4 text-right">
                    <button onclick="window.app.handleDeleteItem('${item.id}')" class="p-2 text-slate-400 hover:text-rose-600 transition-colors rounded-lg hover:bg-rose-50">
                      <i data-lucide="trash-2" class="w-4.5 h-4.5"></i>
                    </button>
                  </td>
                </tr>
              `;
            }).join('');

          itemsHtml = `
            <div class="bg-white rounded-3xl border border-slate-100 overflow-hidden shadow-sm overflow-x-auto">
              <table class="w-full text-left min-w-[600px]">
                <thead class="bg-slate-50 border-b border-slate-100">
                  <tr>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">項目名稱</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">取得日期</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">稀有度</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">評估價值</th>
                    <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase text-right">操作</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-50">
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          `;
        }

        const gridBtnClass = state.viewMode === 'grid' ? 'bg-blue-50 text-blue-600' : 'text-slate-400 hover:text-slate-600';
        const listBtnClass = state.viewMode === 'list' ? 'bg-blue-50 text-blue-600' : 'text-slate-400 hover:text-slate-600';

        contentArea.innerHTML = `
          <div class="space-y-6 fade-in">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <button onclick="window.app.clearCollection()" class="p-2 hover:bg-slate-200 rounded-xl transition-colors">
                  <i data-lucide="chevron-right" class="w-6 h-6 rotate-180"></i>
                </button>
                <div>
                  <h1 class="text-2xl font-bold">${title}</h1>
                  <nav class="flex text-xs text-slate-400 mt-1">
                    <span>首頁</span><span class="mx-2">/</span><span class="text-blue-600">金庫庫存</span>
                  </nav>
                </div>
              </div>
              <div class="flex items-center gap-2 bg-white p-1 rounded-2xl shadow-sm border border-slate-100 self-start md:self-auto">
                <button onclick="window.app.setViewMode('grid')" class="p-2 rounded-xl transition-all ${gridBtnClass}">
                  <i data-lucide="layout-grid" class="w-5 h-5"></i>
                </button>
                <button onclick="window.app.setViewMode('list')" class="p-2 rounded-xl transition-all ${listBtnClass}">
                  <i data-lucide="list" class="w-5 h-5"></i>
                </button>
              </div>
            </div>
            ${itemsHtml}
          </div>
        `;
      }
    }

    // === 匯出全域方法 (提供給 HTML onClick 呼叫) ===
    window.app = {
      handleLogin: async () => {
        try {
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
        } catch (error) {
          console.error("登入失敗:", error);
          alert("登入失敗，請稍後再試");
        }
      },
      handleLogout: () => signOut(auth),
      
      setTab: (tabId) => {
        state.activeTab = tabId;
        if (tabId === 'dashboard') state.selectedCollection = null;
        render();
      },
      
      selectCollection: (colId) => {
        state.selectedCollection = INITIAL_COLLECTIONS.find(c => c.id === colId);
        render();
      },
      
      clearCollection: () => {
        state.selectedCollection = null;
        render();
      },
      
      setViewMode: (mode) => {
        state.viewMode = mode;
        render();
      },
      
      handleSearch: (val) => {
        state.searchQuery = val;
        render();
      },
      
      openModal: () => {
        document.getElementById('add-modal').classList.remove('hidden');
        document.getElementById('item-name').value = '';
        document.getElementById('item-price').value = '';
        state.newItemImageBase64 = '';
        
        // Reset image UI
        document.getElementById('image-preview').classList.add('hidden');
        document.getElementById('img-placeholder-icon').classList.remove('hidden');
        document.getElementById('img-placeholder-text').classList.remove('hidden');
        document.getElementById('img-placeholder-sub').classList.remove('hidden');
        
        const container = document.getElementById('image-preview-container');
        container.classList.remove('border-blue-500', 'bg-blue-50');
        container.classList.add('border-slate-300', 'bg-slate-50');
      },
      
      closeModal: () => {
        document.getElementById('add-modal').classList.add('hidden');
      },
      
      handleImageChange: (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600;
            const MAX_HEIGHT = 600;
            let width = img.width;
            let height = img.height;

            if (width > height && width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            } else if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            state.newItemImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
            
            // Update UI
            const preview = document.getElementById('image-preview');
            preview.src = state.newItemImageBase64;
            preview.classList.remove('hidden');
            
            document.getElementById('img-placeholder-icon').classList.add('hidden');
            document.getElementById('img-placeholder-text').classList.add('hidden');
            document.getElementById('img-placeholder-sub').classList.add('hidden');
            
            const container = document.getElementById('image-preview-container');
            container.classList.remove('border-slate-300', 'bg-slate-50');
            container.classList.add('border-blue-500', 'bg-blue-50');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      },
      
      handleAddItem: async () => {
        const name = document.getElementById('item-name').value;
        const collectionId = document.getElementById('item-collection').value;
        const status = document.getElementById('item-status').value;
        const price = document.getElementById('item-price').value;
        const image = state.newItemImageBase64;

        if (!state.user || !name || !image) {
          alert('請確保已填寫名稱並上傳截圖');
          return;
        }

        const btn = document.getElementById('save-btn');
        btn.disabled = true;
        btn.innerText = '儲存中...';
        
        try {
          const itemsRef = collection(db, 'artifacts', currentAppId, 'users', state.user.uid, 'items');
          await addDoc(itemsRef, {
            name,
            collectionId: Number(collectionId),
            status,
            price,
            image,
            date: new Date().toISOString().split('T')[0],
            tags: ['玩家自訂'],
            rating: 5,
            createdAt: new Date().getTime()
          });
          
          window.app.closeModal();
        } catch (error) {
          console.error("新增虛寶失敗:", error);
          alert('儲存失敗');
        } finally {
          btn.disabled = false;
          btn.innerText = '確認儲存';
        }
      },
      
      handleDeleteItem: async (id) => {
        if (!state.user) return;
        if(confirm('確定要刪除這件珍稀虛寶嗎？此操作無法還原。')){
          try {
            await deleteDoc(doc(db, 'artifacts', currentAppId, 'users', state.user.uid, 'items', id));
          } catch (error) {
            console.error("刪除失敗:", error);
          }
        }
      }
    };

    // === 註冊 Firebase 監聽器 ===
    onAuthStateChanged(auth, (user) => {
      state.user = user;
      
      // 若已登入，建立資料庫即時監聽
      if (user) {
        const itemsRef = collection(db, 'artifacts', currentAppId, 'users', user.uid, 'items');
        if (state.unsubscribeSnapshot) state.unsubscribeSnapshot();
        
        state.unsubscribeSnapshot = onSnapshot(itemsRef, (snapshot) => {
          const fetchedItems = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          fetchedItems.sort((a, b) => b.createdAt - a.createdAt);
          state.items = fetchedItems;
          render();
        }, (error) => {
          console.error("讀取虛寶庫失敗:", error);
        });
      } else {
        if (state.unsubscribeSnapshot) {
          state.unsubscribeSnapshot();
          state.unsubscribeSnapshot = null;
        }
        state.items = [];
        render(); // 重新渲染登入頁面
      }
    });

    // 初始載入 Icon
    lucide.createIcons();

  </script>
</body>
</html>
